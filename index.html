<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Damov Route</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<style>
  :root{
    --ink:#0e1a17; --paper:#f2ede1; --brass:#b8863b; --rust:#c1502e;
    --line:rgba(242,237,225,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);
    font-family:'Helvetica Neue',Arial,sans-serif;}
  #map{position:absolute;inset:0;}

  .panel{position:absolute;z-index:5;background:rgba(14,26,23,0.92);color:var(--paper);
    border:1px solid rgba(242,237,225,0.15);backdrop-filter:blur(6px);}

  #title{top:16px;left:16px;padding:14px 18px;max-width:280px;border-left:3px solid var(--brass);
    transition:max-height 0.25s ease, padding 0.25s ease;max-height:220px;overflow:hidden;}
  #title h1{margin:0 0 2px;font-size:15px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;}
  #title .sub{font-size:12px;opacity:0.65;margin-bottom:8px;}
  #title p{font-size:12.5px;line-height:1.5;margin:0;opacity:0.85;}
  #title.collapsed{max-height:26px;padding-bottom:14px;}
  #title.collapsed #titleChevron{transform:rotate(-90deg);}

  #stops{bottom:16px;left:16px;padding:12px 16px;font-size:12px;width:210px;
    max-height:220px;overflow-y:auto;}
  #stops h2{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;margin:0 0 8px;opacity:0.7;}
  .stop-row{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer;}
  .stop-row .swatch{width:10px;height:10px;border-radius:50%;flex:none;}
  .stop-row .swatch-icon{width:16px;height:16px;border-radius:50%;flex:none;object-fit:cover;}
  .stop-row .count{opacity:0.55;font-size:11px;margin-left:auto;}
  .stop-row input[type=checkbox]{accent-color:#71bf4f;}


  #search{
    top:16px; right:16px; padding:12px 14px; width:230px; font-size:12px;
  }
  #search input{
    width:100%; padding:7px 9px; background:rgba(242,237,225,0.08);
    border:1px solid rgba(242,237,225,0.25); color:var(--paper);
    font-size:12.5px; border-radius:3px; outline:none;
  }
  #search input::placeholder{color:rgba(242,237,225,0.4);}

  #routes{
    top:78px; right:16px; padding:14px 16px; width:230px; max-height:400px;
    overflow-y:auto; font-size:12px; transition:max-height 0.25s ease, padding 0.25s ease;
  }
  #routes h2{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;margin:0 0 8px;opacity:0.7;}
  #routes.collapsed{max-height:38px;overflow:hidden;padding-bottom:14px;}
  #routes.collapsed #routesChevron{transform:rotate(-90deg);}
  .route-row{
    display:flex; align-items:center; gap:8px; padding:7px 0;
    border-top:1px solid rgba(242,237,225,0.1); cursor:pointer;
  }
  .route-row:hover{color:var(--brass);}
  .route-row .swatch{width:12px;height:12px;border-radius:50%;flex:none;}
  .route-row .name{flex:1;}
  .route-row.dimmed{opacity:0.35;}
  .route-row input[type=checkbox]{accent-color:var(--rust);}

  #detail{
    bottom:16px; right:16px; padding:14px 16px; width:230px; font-size:12px;
    display:none;
  }
  #detail h2{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;margin:0 0 8px;opacity:0.7;}
  #detail .row{display:flex;justify-content:space-between;margin:5px 0;}
  #detail .row .v{font-weight:700;color:var(--brass);}
  #detail .close{
    position:absolute; top:10px; right:12px; cursor:pointer; opacity:0.5; font-size:14px;
  }
  #detail .close:hover{opacity:1;}
  #loadingScreen{
    position:fixed;inset:0;z-index:100;background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    transition:opacity 0.4s ease;
  }
  #loadingScreen img{width:96px;height:96px;animation:pulse 1.6s ease-in-out infinite;}
  #loadingScreen .loading-label{color:var(--paper);opacity:0.6;font-size:13px;letter-spacing:0.04em;}
  #loadingScreen.hidden{opacity:0;pointer-events:none;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.7;transform:scale(0.94);}}

  /* Hide the title/intro panel on phone-sized screens — the sidebar
     clutter isn't worth it on a small viewport where map real estate
     matters more. */
  @media (max-width: 640px){
    #title{display:none;}
  }
</style>
</head>

const map = new maplibregl.Map({
  container: 'map',
  // Free, no-API-key vector basemap from CARTO — this gives you real
  // streets/labels underneath your data instead of a flat color panel.
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: ABUJA_CENTER,
  zoom: 12.5,
  attributionControl: true
});

function readProp(props, keys, fallback) {
  // Case-insensitive lookup: your data might use "Name" while the app
  // checks for "name" — this matches them regardless of capitalization,
  // so a casing mismatch can never again cause routes to silently drop.
  const lower = {};
  for (const k in props) lower[k.toLowerCase()] = props[k];
  for (const k of keys) {
    const v = lower[k.toLowerCase()];
    if (v !== undefined) return v;
  }
  return fallback;
}

function loadRoutes() {
  return Promise.resolve(decodeEmbedded('routes'));
}

let allData, activeId = null;
const visibleRouteIds = new Set(); // empty = no routes shown until checked in the list

function updateRouteFilter() {
  if (!map.getLayer('routes-line')) return;
  map.setFilter('routes-line', ['in', ['get', '__id'], ['literal', [...visibleRouteIds]]]);
}

function showLoadError(message) {
  hideLoadingScreen();
  const banner = document.createElement('div');
  banner.className = 'panel';
  banner.style.cssText = 'top:16px;left:50%;transform:translateX(-50%);padding:12px 20px;'
    + 'max-width:520px;border-left:3px solid #c1502e;font-size:13px;line-height:1.5;z-index:10;';
  banner.innerHTML = `<strong style="color:#c1502e;">Couldn't load route data.</strong><br>${message}`;
  document.body.appendChild(banner);
}

function hideLoadingScreen() {
  const el = document.getElementById('loadingScreen');
  if (el) {
    el.classList.add('hidden');
    setTimeout(() => el.remove(), 450);
  }
}

loadRoutes().then(data => {
  if (!data || !data.features || data.features.length === 0) {
    showLoadError(`The embedded route data had no features in it. The file may have been corrupted during editing.`);
    return;
  }
  allData = data;
  allData.features.forEach((f, i) => {
    f.properties.__id = i;
    f.properties.__name = readProp(f.properties, NAME_KEYS, `Route ${i + 1}`);
    f.properties.__code = readProp(f.properties, CODE_KEYS, f.properties.__name);
    f.properties.__category = readProp(f.properties, CATEGORY_KEYS, 'default');
    f.properties.__color = PALETTE[f.properties.__category] || PALETTE.default;
    f.properties.__length_km = (turf.length(f, { units: 'kilometers' })).toFixed(2);
  });

  map.on('load', () => {
    map.addSource('routes', { type: 'geojson', data: allData });
    map.addLayer({
      id: 'routes-line', type: 'line', source: 'routes',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-width': ['case', ['==', ['get', '__id'], -1], 6, 4],
        'line-color': ['get', '__color'],
        'line-opacity': 0.9
      },
      // Nothing is visible until its route is clicked in the Routes list.
      filter: ['in', ['get', '__id'], ['literal', []]]
    });

    buildRouteList();
    loadStops();
    hideLoadingScreen();

    // Frame the initial view on the central routes (Secondary/feeder set),
    // since those are concentrated in the CBD/Wuse/Garki core — rather than
    // the wide span the Primary routes cover out to Kubwa/Gwagwalada/Zuba.
    const centralFeatures = allData.features.filter(f => f.properties.__category === 'feeder');
    if (centralFeatures.length) {
      const bbox = turf.bbox({ type: 'FeatureCollection', features: centralFeatures });
      map.fitBounds(bbox, { padding: 60, duration: 0 });
    }

    map.on('click', 'routes-line', e => showDetail(e.features[0]));
    map.on('mouseenter', 'routes-line', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'routes-line', () => map.getCanvas().style.cursor = '');
  });
}).catch(err => {
  showLoadError(`${err.message}. The embedded route data may have been corrupted — try re-uploading the original file.`);
  console.error('Route data load failed:', err);
});

// --- Stops (Bus Stops / Transit Hubs) ---------------------------------
function loadStops() {
  const el = document.getElementById('stopsRows');
  el.innerHTML = STOP_LAYERS.map(s => `
    <div class="stop-row">
      <input type="checkbox" id="toggle-${s.id}" data-layer="${s.id}" checked />
      ${s.icon
        ? `<img class="swatch-icon" src="${ICON_DATA[s.icon]}" alt="${s.label}" />`
        : `<span class="swatch" style="background:${s.color}"></span>`}
      <span>${s.label}</span>
      <span class="count" id="count-${s.id}">…</span>
    </div>`).join('');

  STOP_LAYERS.forEach(s => {
    const addStopLayer = () => {
      try {
        const data = decodeEmbedded(s.id);
        document.getElementById(`count-${s.id}`).textContent = data.features.length;

        map.addSource(`stops-${s.id}`, { type: 'geojson', data });

        if (s.icon) {
          map.addLayer({
            id: `stops-${s.id}-layer`, type: 'symbol', source: `stops-${s.id}`,
            layout: { 'icon-image': s.icon, 'icon-size': 0.22, 'icon-allow-overlap': true }
          });
        } else {
          map.addLayer({
            id: `stops-${s.id}-layer`, type: 'circle', source: `stops-${s.id}`,
            paint: {
              'circle-radius': 5,
              'circle-color': s.color,
              'circle-stroke-width': 1.5,
              'circle-stroke-color': '#0e1a17'
            }
          });
        }

        map.on('click', `stops-${s.id}-layer`, e => {
          const f = e.features[0];
          new maplibregl.Popup({ offset: 10 })
            .setLngLat(e.lngLat)
            .setHTML(`<strong>${f.properties.Name}</strong>`)
            .addTo(map);
        });
        map.on('mouseenter', `stops-${s.id}-layer`, () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', `stops-${s.id}-layer`, () => map.getCanvas().style.cursor = '');
      } catch (err) {
        document.getElementById(`count-${s.id}`).textContent = '—';
        console.error(`Failed to load embedded data for ${s.id}:`, err);
      }
    };

    if (s.icon) {
      map.loadImage(ICON_DATA[s.icon]).then(image => {
        if (!map.hasImage(s.icon)) map.addImage(s.icon, image.data);
        addStopLayer();
      }).catch(err => {
        console.error('Icon load failed:', err);
        addStopLayer();
      });
    } else {
      addStopLayer();
    }
  });

  el.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const layerId = `stops-${cb.dataset.layer}-layer`;
      if (map.getLayer(layerId)) {
        map.setLayoutProperty(layerId, 'visibility', cb.checked ? 'visible' : 'none');
      }
    });
  });
}

function buildRouteList(filterText = '') {
  const el = document.getElementById('routeList');
  const rows = allData.features
    .filter(f => {
      const q = filterText.toLowerCase();
      return f.properties.__name.toLowerCase().includes(q) ||
             f.properties.__code.toLowerCase().includes(q);
    })
    .map(f => {
      const p = f.properties;
      const dimmed = activeId !== null && activeId !== p.__id ? 'dimmed' : '';
      return `
        <div class="route-row ${dimmed}" data-id="${p.__id}" title="${p.__name}">
          <span class="swatch" style="background:${p.__color}"></span>
          <span class="name">${p.__code}</span>
        </div>`;
    }).join('');
  el.innerHTML = rows || '<div style="opacity:0.5;padding:8px 0;">No matches</div>';

  el.querySelectorAll('.route-row').forEach(row => {
    row.addEventListener('click', () => {
      const id = +row.dataset.id;
      const feature = allData.features.find(f => f.properties.__id === id);
      if (!visibleRouteIds.has(id)) {
        visibleRouteIds.add(id);
        updateRouteFilter();
      }
      focusRoute(feature);
    });
  });
}

function focusRoute(feature) {
  activeId = activeId === feature.properties.__id ? null : feature.properties.__id;
  buildRouteList(document.getElementById('searchInput').value);

  if (activeId !== null) {
    const bbox = turf.bbox(feature);
    map.fitBounds(bbox, { padding: 80, duration: 800 });
    map.setPaintProperty('routes-line', 'line-opacity', [
      'case', ['==', ['get', '__id'], activeId], 1, 0.15
    ]);
    showDetail(feature);
  } else {
    map.setPaintProperty('routes-line', 'line-opacity', 0.9);
    hideDetail();
  }
}

function showDetail(feature) {
  const p = feature.properties;
  const km = readProp(p, ['total_kilometer', 'total_km'], null);
  const minutes = readProp(p, ['total_minutes'], null);
  const stops = readProp(p, ['stop_count'], null);

  document.getElementById('detailName').textContent = p.__name;
  document.getElementById('detailType').textContent = CATEGORY_LABELS[p.__category] || p.__category;
  document.getElementById('detailLength').textContent = (km !== null ? km : p.__length_km) + ' km';
  document.getElementById('detailDuration').textContent = minutes !== null ? minutes + ' min' : '—';
  document.getElementById('detailStops').textContent = stops !== null ? stops : '—';
  document.getElementById('detail').style.display = 'block';
}
function hideDetail() {
  document.getElementById('detail').style.display = 'none';
}

document.getElementById('searchInput').addEventListener('input', e => {
  buildRouteList(e.target.value);
});
document.getElementById('detailClose').addEventListener('click', () => {
  activeId = null;
  buildRouteList(document.getElementById('searchInput').value);
  map.setPaintProperty('routes-line', 'line-opacity', 0.9);
  hideDetail();
});
document.getElementById('titleToggle').addEventListener('click', () => {
  document.getElementById('title').classList.toggle('collapsed');
});
document.getElementById('routesToggle').addEventListener('click', () => {
  document.getElementById('routes').classList.toggle('collapsed');
});
</script>
